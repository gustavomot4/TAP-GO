<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAP GO</title>
    <link rel="icon" href="./assets/TAPGO.png">
    <link rel="stylesheet" href="./style/tapgo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="tela-jogo">


        <button class="btn-sair" id="btn_voltar" onclick="Voltar()" style="display: block;">
            <i class="fas fa-arrow-left"></i>
            <span class="btn-sair-span">Voltar</span>
        </button>
        <div id="tela_menu_visivel">

            <!-- tela menu -->

            <div class="tela-menu">

                <div class="navbar_visivel" id="navbar_visivel" style="display: block;">
                    <div class="navbar">
                        <div class="nav-logo">
                            <img src="./assets/TAPGO-GRANDE.png" alt="Logo TAPGO">
                        </div>

                        <div class="nav-link">
                            <p onclick="Jogar()">Jogar</p>
                        </div>
                        <div class="nav-link">
                            <a href="./dashboard.html">
                                <p>Minha carreira</p>
                            </a>
                        </div>
                        <div class="nav-link">
                            <p>Ranking</p>
                        </div>
                        <div class="nav-link">
                            <p>Como Jogar?</p>
                        </div>
                        <div class="nav-link">
                            <p onclick="MudarPaginaLogin()">Sair</p>
                        </div>
                    </div>
                </div>

                <!-- tela para escolher o time -->

                <div class="tela-time-visivel" id="tela_time_visivel" style="display: none;">

                    <div class="tela-time">
                        <div class="container-time" id="container_time">
                            <h2 class="time-titulo">Escolha seu time!</h2>
                        </div>
                    </div>

                </div>


                <!-- informação do usuario -->
                <div class="conteudo-menu">
                    <div class="info-usuario">
                        <div class="nome-usuario">
                            <p id="nome_usuario"></p>
                        </div>
                        <div class="img-usuario"><img src="./assets/escudoMeninosDoMorro.png" alt=""></div>
                        <div class="nivel-usuario">
                            <p id="nivel_usuario">Level: </p>
                        </div>
                    </div>
                </div>

            </div>
        </div>


        <div id="tela_jogo_visivel" style="display: none;">

            <div class="placar-canto">
                <!-- Placar do usuário -->
                <div class="time usuario" id="time_usuario">
                    <div class="chutes" id="div_chutes_usuario">
                    </div>
                </div>

                <!-- Placar do adversário -->
                <div class="time adversario" id="time_adversario">
                    <div class="chutes" id="div_chutes_adv">
                    </div>
                </div>
            </div>

            <!-- chute -->
            <div id="escolher_canto_chute_visivel" style="display: block;">
                <h2 class="tela-chute-titulo">Chute</h2>
                <div class="escolher-canto">
                    <div class="canto" id="canto_esquerdo" onclick="Chute(this)"></div>
                    <div class="canto" id="canto_meio" onclick="Chute(this)"></div>
                    <div class="canto" id="canto_direito" onclick="Chute(this)"></div>
                </div>
            </div>

            <!-- defesa -->
            <div id="escolher_canto_defesa_visivel" style="display: none;">
                <h2 class="tela-chute-titulo">Defenda</h2>
                <div class="escolher-canto">
                    <div class="defesa" id="canto_esquerdo" onclick="Defesa(this)"></div>
                    <div class="defesa" id="canto_meio" onclick="Defesa(this)"></div>
                    <div class="defesa" id="canto_direito" onclick="Defesa(this)"></div>
                </div>
            </div>

            <!-- resultado do chute ou defesa-->
            <div id="resultado_visivel">
            </div>

        </div>


        <!-- fim de jogo -->
        <div id="fim_jogo_visivel" style="display: none;">
            <div class="fim-jogo">
                <div class="card-placar">
                    <div id="quem_venceu"></div>
                    <div class="placar-fim">
                        <div id="logo_usuario_fim_jogo"></div>
                        <div id="placar_usuario"></div>
                        X
                        <div id="placar_adversario"></div>
                        <div id="logo_adversario_fim_jogo"></div>
                    </div>
                    <div class="card-button">
                       <div class="button-fim-jogo jogar" onclick="Jogar()">Jogar Novamente</div></a>
                         <a href="./dashboard.html"><div class="button-fim-jogo dashboard">Ver Carreira</div></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
<script src="./js/tapgo.js"></script>
<script src="./js/sessao.js"></script>
