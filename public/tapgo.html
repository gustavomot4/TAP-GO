<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAP GO</title>
    <link rel="stylesheet" href="./style/tapgo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="tela-jogo">
        <!-- tela inicial -->
        <div id="tela_inicial_visivel" style="display: block;">
            <div class="tela-inicial">

                <button class="btn-sair" id="btn_sair" style="opacity: 0;" onclick="MudarPagina()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="btn-sair-span">Sair</span>
                </button>

                <video autoplay class="video-intro" id="videoIntro">
                    <source src="./assets/background/intro.mp4" type="video/mp4">
                </video>

                <button class="btn-jogar" id="btn_jogar" style="opacity: 0;" onclick="Jogar()">
                    <span>Jogar</span>
                </button>

            </div>
        </div>

        <!-- tela menu -->
        <div id="tela_menu_visivel" style="display: none;">
            <div class="tela-menu">
                <div class="navbar">
                    <div class="nav-logo">
                        <img src="./assets/TAPGO-GRANDE.png" alt="Logo TAPGO">
                    </div>

                    <div class="nav-link">
                        <p>Jogar</p>
                    </div>
                    <div class="nav-link">
                        <p>Últimas Partidas</p>
                    </div>
                    <div class="nav-link">
                        <p>Ranking</p>
                    </div>
                    <div class="nav-link">
                        <p>Como Jogar?</p>
                    </div>
                    <div class="nav-link">
                        <p onclick="MudarPaginaLogin()">Sair</p>
                    </div>
                </div>
                <div class="conteudo-menu">
                    <div class="info-usuario">
                        <div class="nome-usuario"><p id="nome_usuario"></p></div>
                        <div class="img-usuario"><img src="./assets/escudoMeninosDoMorro.png" alt=""></div>
                        <div class="nivel-usuario"><p>Level 1</p></div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
<script src="./js/tapgo.js"></script>
<script src="./js/index.js"></script>
